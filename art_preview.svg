<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 240" width="100%" height="240" fill="none">
  <defs>
    <!-- Widget Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="red-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FF1744" flood-opacity="0.8"/>
    </filter>
    <filter id="green-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00E676" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Simulated Phone Wallpaper Backdrop -->
  <rect width="540" height="240" rx="24" fill="#1E293B" />
  <radialGradient id="wallGlow" cx="70%" cy="60%" r="50%">
    <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
  </radialGradient>
  <rect width="540" height="240" rx="24" fill="url(#wallGlow)" />

  <!-- The 2x1 Widget Surface -->
  <g transform="translate(30, 30)" filter="url(#shadow)">
    <!-- Widget Rounded Clipping Mask -->
    <clipPath id="widgetClip">
      <rect width="480" height="180" rx="32" fill="#FBF8F3"/>
    </clipPath>

    <g clip-path="url(#widgetClip)">
      <!-- Canvas Base -->
      <rect width="480" height="180" fill="#FBF8F3"/>

      <!-- Terracotta Organic Curve -->
      <path d="M-20 0 C80 70 120 160 40 200 L-40 200 Z" fill="#E76F51" />

      <!-- Golden Sun Circle -->
      <circle cx="190" cy="50" r="50" fill="#F4A261" />

      <!-- Deep Mulberry / Violet Organic Arc -->
      <path d="M280 200 C300 70 420 40 500 90 L500 200 Z" fill="#6A0572" opacity="0.85" />

      <!-- Mint Green Organic Blob -->
      <path d="M160 120 Q220 170 280 135 T340 170 L300 200 L160 200 Z" fill="#2A9D8F" opacity="0.9" />

      <!-- Whimsical Ink Squiggle -->
      <path d="M240 30 Q280 55 320 30 T360 55" fill="none" stroke="#264653" stroke-width="3" />

      <!-- Foreground: Floating Black Concentric Rings (Left) -->
      <g transform="translate(60, 90)">
        <!-- Outer Black Ring -->
        <circle cx="0" cy="0" r="42" fill="none" stroke="#000000" stroke-width="4.5" />
        <!-- Inner Black Ring -->
        <circle cx="0" cy="0" r="26" fill="none" stroke="#000000" stroke-width="3.5" />
        
        <!-- Living Core (Active Received State Example) -->
        <circle cx="0" cy="0" r="22" fill="#FF1744" opacity="0.3" filter="url(#red-glow)" />
        <circle cx="0" cy="0" r="14" fill="#FF1744" />
      </g>

      <!-- Foreground: Floating Black Dots (Center) -->
      <g transform="translate(240, 90)">
        <circle cx="-30" cy="0" r="5" fill="#000000" />
        <circle cx="-10" cy="0" r="5" fill="#000000" />
        <circle cx="10" cy="0" r="5" fill="#000000" />
        <circle cx="30" cy="0" r="5" fill="#000000" />
      </g>

      <!-- Foreground: Monospace Tag (Right) -->
      <text x="420" y="96" text-anchor="middle" font-family="monospace" font-size="22" font-weight="900" fill="#000000" letter-spacing="1">
        [ 19 • S ]
      </text>

      <!-- Subtitle badge in bottom right -->
      <rect x="365" y="145" width="95" height="22" rx="6" fill="#000000" opacity="0.08" />
      <text x="412" y="160" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#264653" letter-spacing="0.5">
        2×1 ART TILE
      </text>
    </g>

    <!-- Subtle border -->
    <rect width="480" height="180" rx="32" fill="none" stroke="#000000" stroke-opacity="0.12" stroke-width="2"/>
  </g>
</svg>
